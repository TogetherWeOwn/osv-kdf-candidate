name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group: {}
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: scaffold validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test scaffold guards
        run: python3 -I -m unittest discover -s .github/tests -v
      - name: Lint workflows (actionlint)
        run: |
          set -euo pipefail
          download_dir=$(mktemp -d "$RUNNER_TEMP/actionlint-download.XXXXXX")
          bin_dir=$(mktemp -d "$RUNNER_TEMP/actionlint-bin.XXXXXX")
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            -o "$download_dir/actionlint.tgz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          printf '%s  %s\n' \
            023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 \
            "$download_dir/actionlint.tgz" | sha256sum -c -
          tar -xzf "$download_dir/actionlint.tgz" -C "$bin_dir" actionlint
          "$bin_dir/actionlint" -shellcheck= -pyflakes=

  ci-ok:
    name: ci-ok
    needs: [lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require scaffold validation success
        run: python3 -I .github/scripts/check_ci.py
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
