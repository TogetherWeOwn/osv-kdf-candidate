name: gitleaks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history
        run: |
          set -euo pipefail
          download_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks-download.XXXXXX")
          bin_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks-bin.XXXXXX")
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            -o "$download_dir/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          test "$(wc -c < "$download_dir/gitleaks.tgz")" -eq 8230402
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$download_dir/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$download_dir/gitleaks.tgz" -C "$bin_dir" gitleaks
          "$bin_dir/gitleaks" detect --source "$GITHUB_WORKSPACE" --redact --exit-code 1
